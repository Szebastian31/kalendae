<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalendae icons</title>
<style>
  body{margin:0;min-height:100vh;background:#efe8da;color:#1d2230;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:32px}
  h1{font-family:"New York","Iowan Old Style",Palatino,Georgia,serif;font-weight:400;font-size:34px;margin:0 0 6px}
  p{color:#6c6a66;max-width:60ch}
  .grid{display:flex;flex-wrap:wrap;gap:22px;margin-top:22px}
  .card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 14px 30px -20px rgba(30,30,60,.4);text-align:center}
  .card img{display:block;width:160px;height:160px;margin:0 auto 10px}
  button{border:0;border-radius:12px;padding:9px 14px;background:#1d2230;color:#fff;font:inherit;cursor:pointer}
</style>
</head>
<body>
<h1>Kalendae icons</h1>
<p>Saves the PNG files the web app needs into the <b>icons/</b> folder: open this page once in Chrome, press “Download all”, and upload the four files to <b>icons/</b> in the repo. The Android launcher icon is drawn separately as vectors in <b>app/src/main/res/drawable/</b>.</p>
<button id="all">Download all</button>
<div class="grid" id="grid"></div>
<script src="icons/icon.js"></script>
<script>
const FILES = [
  ['icon-192.png', 192, {}],
  ['icon-512.png', 512, {}],
  ['icon-maskable-512.png', 512, { square: true }],
  ['apple-touch-icon.png', 180, { square: true }],
  ['playstore-512.png', 512, { square: true }],
];
const grid = document.getElementById('grid');
const made = [];
FILES.forEach(([name, size, opt]) => {
  svgToPng(iconSVG(opt), size).then(url => {
    made.push([name, url]);
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `<img src="${url}" alt="${name}"><div>${name}</div><div style="color:#6c6a66;font-size:12px">${size} × ${size}</div><button style="margin-top:8px">Download</button>`;
    c.querySelector('button').onclick = () => download(url, name);
    grid.appendChild(c);
  });
});
document.getElementById('all').onclick = () => made.forEach(([n, u], i) => setTimeout(() => download(u, n), i * 350));
</script>
</body>
</html>
