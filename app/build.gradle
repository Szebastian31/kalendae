plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kalendae.money'
    compileSdk 34

    defaultConfig {
        applicationId "com.kalendae.money"
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName "0.3.0"
    }

    // One fixed key (debug.keystore in the repo root, a copy of Fidelis's fidelis-debug.keystore), so every
    // new APK installs over the old one and keeps your data. Without it, each build gets a random key.
    def fixedKey = rootProject.file('debug.keystore')
    signingConfigs {
        debug {
            if (fixedKey.exists()) {
                storeFile fixedKey
                storePassword 'fidelis123'
                keyAlias 'fidelis'
                keyPassword 'fidelis123'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The web app at the repo root is the app's interface. It's copied into the APK at build time,
    // so GitHub Pages and the APK always run the same files.
    sourceSets {
        main {
            assets.srcDirs += ["$buildDir/generated/kalendae-web"]
        }
    }
}

tasks.register('copyWebApp', Copy) {
    from(rootProject.projectDir) {
        include 'index.html', '*.js', 'icons/icon.svg', 'icons/icon.js'
        exclude 'sw.js'
    }
    into "$buildDir/generated/kalendae-web/www"
}
preBuild.dependsOn copyWebApp

dependencies {
    // serves the bundled web app from a secure https origin inside the WebView
    implementation 'androidx.webkit:webkit:1.11.0'
}
