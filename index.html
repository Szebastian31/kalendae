<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kalendae</title>
<meta name="description" content="A forecast for your money: what's coming, and what's safe to spend until payday.">
<meta name="theme-color" content="#070d26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalendae">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Night = Caelum's sky, Dawn = Augur's dusk, Paper = Augur's paper */
:root{
  --serif:"New York","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Roboto,sans-serif;
  --sky-top:#070d26;--sky-mid:#14215a;--sky-bot:#2b3d7e;--glow:rgba(143,214,255,.2);
  --tile:rgba(255,255,255,.07);--solid:#13204f;--onInk:#0b1433;
  --ink:#eef3ff;--ink2:rgba(238,243,255,.74);--muted:rgba(238,243,255,.5);--line:rgba(255,255,255,.13);--gold:#ffcf9e;
  --a1:#8fd6ff;--a2:#ff9fb4;--a3:#5fe3a1;--a4:#b9a8ff;--a5:#7fe0d6;--a6:#e9c46a;
  --warn:#ffc061;--good:#5fe3a1;--bad:#ff8a80;
  --r1:#ffe6b4;--r2:#ffbf96;--r3:#ff93ac;--ringGlow:rgba(255,170,160,.55);
  --glass:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05) 55%,rgba(255,255,255,.09));
  --edge:linear-gradient(160deg,rgba(255,255,255,.42),rgba(255,255,255,.07) 45%,rgba(255,255,255,.16));
  --lift:0 22px 44px -22px rgba(3,6,28,.7);
  color-scheme:dark;
}
[data-look=dawn]{--sky-top:#2a1b6a;--sky-mid:#77479a;--sky-bot:#e0828e;--glow:rgba(255,205,150,.45);--solid:#4d2f7f;--onInk:#2a1236;
  --ink:#f4f0ff;--ink2:rgba(244,240,255,.76);--muted:rgba(244,240,255,.54);--gold:#ffe2bc;--a1:#a9c8ff;--a2:#ffb3c2;--a4:#d2c2ff;--r1:#fff0d0;--r2:#ffc7a0;--r3:#ff9fb4}
[data-look=paper]{--sky-top:#f7f1e6;--sky-mid:#f1e7d8;--sky-bot:#ecdcca;--glow:rgba(255,180,150,.35);
  --tile:rgba(60,30,40,.05);--solid:#fbf6ee;--onInk:#fff;
  --ink:#22182e;--ink2:rgba(34,24,46,.72);--muted:rgba(34,24,46,.5);--line:rgba(60,30,40,.11);--gold:#b4532a;
  --a1:#3f5fb0;--a2:#c2416b;--a3:#2f9d68;--a4:#6a52c7;--a5:#1f7f8a;--a6:#a4782a;--warn:#b4621a;--good:#2f9d68;--bad:#c0392b;
  --r1:#c0662e;--r2:#c24a54;--r3:#a8376e;--ringGlow:transparent;
  --glass:linear-gradient(160deg,rgba(255,255,255,.86),rgba(255,255,255,.58));
  --edge:linear-gradient(160deg,#fff,rgba(60,30,40,.1) 60%,rgba(60,30,40,.06));
  --lift:0 20px 40px -24px rgba(80,40,30,.35);color-scheme:light}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--sky-top)}
body{color:var(--ink);font:15px/1.5 var(--sans);overflow:hidden;
  background:radial-gradient(120% 50% at 50% -5%,var(--glow),transparent 62%),linear-gradient(180deg,var(--sky-top),var(--sky-mid) 58%,var(--sky-bot));background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums lining-nums}

/* layout */
#scroll{position:fixed;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 168px);scrollbar-width:none}
#scroll::-webkit-scrollbar{display:none}
main{max-width:480px;margin:0 auto}
header.top{display:flex;align-items:center;gap:11px;margin:4px 0 6px}
header.top .ico{width:38px;height:38px;flex:none;border-radius:11px;overflow:hidden;box-shadow:0 6px 14px -6px rgba(0,0,0,.5)}
header.top .ico svg{width:100%;height:100%;display:block}
header.top h1{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1;letter-spacing:-.3px}
header.top .date{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-top:4px}
.pill{margin-inline-start:auto;border:1px solid transparent;background:var(--glass) padding-box,var(--edge) border-box;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;letter-spacing:.4px;cursor:pointer;display:flex;align-items:center;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid transparent;background:var(--glass) padding-box,var(--edge) border-box;cursor:pointer;flex:none}
.iconbtn svg,.sv{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.view{display:none;animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{background:var(--glass) padding-box,var(--edge) border-box;border:1px solid transparent;border-radius:24px;padding:16px;margin-top:12px;box-shadow:var(--lift)}
.card h3{font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-bottom:11px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 em{font-style:normal;letter-spacing:0;text-transform:none;font-weight:500;font-size:12px;color:var(--ink2)}
.big{font-family:var(--serif);font-size:42px;line-height:1;letter-spacing:-.8px}
.sub{font-size:12.5px;color:var(--ink2);line-height:1.45}
.muted{color:var(--muted)}
.honest{font-family:var(--serif);font-style:italic;font-size:12.5px;line-height:1.5;color:var(--muted);margin:16px 6px 0}
.grp{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.grp:first-child{margin-top:0}
.mix{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;margin:14px 0 6px}

.acct{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.grp + .acct{border-top:0}
.sw{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#0b1433}
[data-look=paper] .sw{color:#fff}
.sw svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.acct .nm{font-size:14.5px;font-weight:500}
.acct .meta{font-size:11.5px;color:var(--muted);margin-top:1px}
.acct .bal{text-align:right;font-family:var(--serif);font-size:18px;white-space:nowrap}
.acct .bal small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted)}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:1px 6px;border-radius:6px;background:var(--tile);color:var(--ink2);margin-inline-start:6px;vertical-align:1px}

.empty{text-align:center;padding:26px 8px 10px}
.empty .big{font-size:30px;margin:12px 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:15px;padding:12px 16px;font-weight:600;font-size:14.5px;cursor:pointer;
  background:linear-gradient(115deg,var(--r1),var(--r2) 45%,var(--r3));color:var(--onInk);box-shadow:0 12px 24px -12px var(--ringGlow)}
.btn.ghost{background:var(--glass) padding-box,var(--edge) border-box;border:1px solid transparent;color:var(--ink);box-shadow:none}
.btn.wide{width:100%}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad);box-shadow:none}
.row2{display:flex;gap:8px;margin-top:12px}.row2 .btn{flex:1}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--tile);font-size:12.5px;color:var(--ink2);padding:6px 11px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--onInk);border-color:var(--ink)}
.chip.lock::after{content:"·";margin-left:-2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.rates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.rates div{background:var(--tile);border-radius:14px;padding:9px 11px;font-size:11px;color:var(--muted)}
.rates b{display:block;font-family:var(--serif);font-weight:400;font-size:16px;color:var(--ink);margin-top:2px}

.soon{text-align:center;padding:40px 10px}
.soon .big{font-size:30px;margin:16px 0 8px}

/* 12 account colours per look (a1–a6 are set above) */
:root{--a7:#ffb27a;--a8:#f48fd8;--a9:#9ec5ff;--a10:#c8e66b;--a11:#ff7f7f;--a12:#d9d4c7}
[data-look=dawn]{--a7:#ffc49a;--a8:#f7a6e0;--a9:#b8d4ff;--a10:#d4ec8a;--a11:#ff9a9a;--a12:#e8e2d6}
[data-look=paper]{--a7:#c96a2b;--a8:#a8408f;--a9:#4a7fc9;--a10:#6f8f1f;--a11:#b83a3a;--a12:#6e675a}
.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.swatches button{aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);transition:transform .15s}
.swatches button.on{box-shadow:0 0 0 2px var(--sky-top),0 0 0 4px var(--ink);transform:scale(.9)}

.link{color:var(--gold);text-decoration:none;font-weight:600}
.kindgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kindgrid button{border:1px solid transparent;background:var(--glass) padding-box,var(--edge) border-box;border-radius:16px;padding:12px 4px;font-size:11.5px;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.kindgrid button svg{stroke:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.card > .stats:first-child{margin-top:0}
.stat{background:var(--tile);border-radius:16px;padding:10px 11px;min-width:0}
.stat .k{font-size:9.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--serif);font-size:19px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:11px;color:var(--ink2);margin-top:2px;line-height:1.35}

.list{list-style:none}
.list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .it{cursor:pointer}
.list .when{width:40px;text-align:center;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;line-height:1.1}
.list .when b{display:block;font-family:var(--serif);font-size:19px;color:var(--ink);letter-spacing:0;font-weight:400}
.list .nm{font-size:14.5px}
.list .meta{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:2px;flex-wrap:wrap}
.list .amt{font-size:14.5px;text-align:right;white-space:nowrap}
.list .amt small{display:block;font-size:11px;color:var(--muted)}
.pos{color:var(--good)}

.orbitWrap{position:relative;width:100%;height:min(86vw,360px);margin-top:4px}
.orbitWrap svg{position:absolute;inset:0;width:100%;height:100%}
.orbitCenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44%;max-width:170px;text-align:center}
.orbitCenter .k{font-size:9.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.orbitCenter .big{font-size:clamp(26px,8.5vw,36px);margin:7px 0 5px}
.orbitCenter .row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:2px 0;color:var(--ink2);text-align:start}
.orbitCenter .row b{color:var(--ink);white-space:nowrap}
.legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}

.warn{background:linear-gradient(160deg,color-mix(in srgb,var(--warn) 18%,transparent),color-mix(in srgb,var(--warn) 6%,transparent)) padding-box,var(--edge) border-box}
.wt{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45}
.wt svg{color:var(--warn);flex:none;margin-top:2px}
.trial{background:linear-gradient(135deg,color-mix(in srgb,var(--a4) 22%,transparent),transparent 70%) padding-box,var(--edge) border-box;cursor:default}

.agree{display:flex;gap:14px;align-items:center}
.agree ul{list-style:none;font-size:12.5px;line-height:1.4;min-width:0}
.agree li{display:flex;gap:7px;padding:3px 0;color:var(--ink2)}
.agree li i{font-style:normal;width:14px;flex:none;text-align:center}
.agree li.y i{color:var(--good)}.agree li.n i{color:var(--warn)}

.planbar{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;margin:4px 0 14px}
.planlist{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;font-size:13.5px}
.planlist .l{display:flex;align-items:flex-start;gap:8px;color:var(--ink2)}
.planlist .l .dot{margin-top:6px}
.planlist small{display:block;font-size:11px;color:var(--muted)}
.planlist .num{text-align:right}

.chartWrap{position:relative;width:100%;height:clamp(200px,32vh,260px);overflow:hidden}
.chartWrap svg{position:absolute;inset:0}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--ink);color:var(--onInk);font-size:11.5px;line-height:1.45;padding:8px 10px;border-radius:11px;opacity:0;transition:opacity .15s;width:178px;z-index:2}
.fkeys{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.fkeys span{display:inline-flex;align-items:center;gap:6px}
.fkeys i{display:inline-block;width:16px;height:2px;border-radius:1px}
.fkeys i.band{height:9px;width:13px;border-radius:3px;background:var(--ink);opacity:.18}
.fkeys i.dash{background:repeating-linear-gradient(90deg,var(--muted) 0 3px,transparent 3px 6px)}
.fkeys i.pay{width:7px;height:7px;border-radius:50%;background:var(--gold)}

/* check-ins, cash count, keep / review / cancel */
.ci{padding:14px 0;border-top:1px solid var(--line)}
.ci:first-of-type{border-top:0}
.ci-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ci-h .meta{font-size:11.5px;color:var(--muted)}
.ci-h .tag{margin-inline-start:auto}
.sw.sm{width:30px;height:30px;border-radius:10px}
.sw.sm svg{width:16px;height:16px}
.notes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.notes label{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:6px 8px;font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;gap:1px}
.notes input{border:0;background:none;outline:none;font-family:var(--serif);font-size:19px;color:var(--ink);width:100%}
.cashTotal{margin-top:8px;font-weight:600}
.cires{list-style:none;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.cires li{padding:9px 0;border-top:1px solid var(--line)}
.cires li:first-child{border-top:0}
.cires b{color:var(--ink)}
.ciCard{background:linear-gradient(160deg,color-mix(in srgb,var(--a1) 16%,transparent),transparent 75%) padding-box,var(--edge) border-box}
.ciCard .wt svg{color:var(--a1)}
.list .when.vr{display:grid;place-items:center}
.verdict{display:block;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-top:2px}
.why{margin-top:16px;background:var(--tile);border:1px solid var(--line);border-radius:18px;padding:12px 14px;font-size:12.5px;line-height:1.5;color:var(--ink2)}
.why-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:14px}
.why > div:not(.why-h){display:flex;gap:8px;padding:3px 0}
.why i{font-style:normal;font-weight:700;width:62px;flex:none}

/* tab bar */
nav.tabs{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);max-width:452px;margin:0 auto;height:64px;padding:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-radius:24px;z-index:20;
  background:color-mix(in srgb,var(--solid) 78%,transparent) padding-box,var(--edge) border-box;border:1px solid transparent;backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:var(--lift)}
nav.tabs button{border:0;background:none;font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:18px;cursor:pointer}
nav.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--ink);background:color-mix(in srgb,var(--gold) 14%,transparent)}
nav.tabs button.on svg{color:var(--gold)}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;max-height:90%;overflow-y:auto;border-radius:30px 30px 0 0;
  padding:10px 20px calc(env(safe-area-inset-bottom) + 26px);transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1);
  background:linear-gradient(color-mix(in srgb,var(--sky-mid) 90%,#fff 4%),var(--sky-top)) padding-box,var(--edge) border-box;border:1px solid transparent;border-bottom:0;scrollbar-width:none}
[data-look=paper] .sheet{background:linear-gradient(#fffaf2,#f6eee2) padding-box,var(--edge) border-box}
.sheet.show{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--muted);opacity:.6;margin:0 auto 14px}
.sheet h2{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1;margin-bottom:4px}
.sheet .lead{font-size:13px;color:var(--ink2);margin-bottom:14px}
.field{margin-top:14px}
.field>label{display:block;font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--tile);outline:none;font-size:15.5px}
.input:focus{border-color:var(--gold)}
.input.money{font-family:var(--serif);font-size:26px;padding:8px 14px}
.typegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.typegrid button{border:1px solid var(--line);background:var(--tile);border-radius:14px;padding:10px 4px;font-size:11px;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.typegrid button svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.typegrid button.on{border-color:var(--gold);color:var(--ink);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.split{display:flex;align-items:center;gap:10px;margin-top:10px}
.split input[type=range]{flex:1;accent-color:var(--gold)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14.5px}
.tog:first-child{border-top:0}
.tog small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.sw-t{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s;border:0}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.sw-t.on{background:var(--good)}.sw-t.on::after{transform:translateX(18px)}
.seg{display:flex;background:var(--tile);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:11px;font-size:13px;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--onInk);font-weight:600}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.looks button{border:2px solid transparent;border-radius:16px;height:64px;cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px}
.looks button.on{border-color:var(--ink)}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-10px);z-index:70;padding:9px 14px;border-radius:16px;font-size:13px;font-weight:600;
  background:var(--ink);color:var(--onInk);opacity:0;transition:all .3s;pointer-events:none;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* right-to-left (Arabic): mirror the layout, keep charts, rings and number bars reading left to right */
[dir=rtl] .orbitWrap,[dir=rtl] .chartWrap,[dir=rtl] .mix,[dir=rtl] .planbar{direction:ltr}
[dir=rtl] .sw-t.on::after{transform:translateX(-18px)}[dir=rtl] .sw-t::after{left:auto;right:3px}

/* spending: the quick "log a spend" button, receipts */
.fab{position:fixed;right:max(22px,calc(50% - 226px + 8px));bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:21;width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--r1),var(--r2) 45%,var(--r3));color:var(--onInk);box-shadow:0 14px 28px -10px var(--ringGlow),0 8px 18px -8px rgba(0,0,0,.45)}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.fab[hidden]{display:none}
[dir=rtl] .fab{right:auto;left:max(22px,calc(50% - 226px + 8px))}
.spendCard{background:linear-gradient(160deg,color-mix(in srgb,var(--a3) 14%,transparent),transparent 75%) padding-box,var(--edge) border-box}
.rcpt{display:inline-grid;place-items:center;margin-inline-start:6px;vertical-align:-2px;color:var(--gold)}
.rcpt svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rcptBox{display:flex;gap:12px;align-items:flex-start}
.rcptBox img{width:96px;height:128px;object-fit:cover;border-radius:14px;border:1px solid var(--line);background:var(--tile);cursor:zoom-in;flex:none}
.rcptBtns{display:flex;flex-wrap:wrap;gap:6px}.rcptBtns .btn{padding:8px 12px;font-size:13px}
.viewer{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.viewer img{max-width:100%;max-height:100%;border-radius:10px}

/* 1.2: swipe a sheet down to close it (a bigger target around the handle), column charts */
.sheet{overscroll-behavior:contain}
.grab{position:relative;touch-action:none}
.grab::before{content:"";position:absolute;inset:-12px -70px -10px}
.bars{display:block;width:100%;height:auto;margin-top:10px;overflow:visible}
.bars rect[data-i]{cursor:pointer;transition:opacity .15s}
.cap{min-height:18px;font-size:12px;color:var(--ink2);margin-top:4px}
[dir=rtl] .bars{direction:ltr}
</style>
</head>

<nav class="tabs" id="tabs">

  <button data-tab="accounts"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="2.5"/><rect x="8" y="4" width="13" height="10" rx="2.5"/></svg><span data-t="Accounts">Accounts</span></button>
