<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kalendae</title>
<meta name="description" content="A forecast for your money: what's coming, and what's safe to spend until payday.">
<meta name="theme-color" content="#070d26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kalendae">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --sky-top:#070d26;--sky-mid:#14215a;--sky-bot:#2b3d7e;
  --ink:#eef3ff;--ink2:rgba(238,243,255,.74);--muted:rgba(238,243,255,.5);--line:rgba(255,255,255,.13);
  --good:#5fe3a1;--warn:#ffc061;--r1:#ffe6b4;--r2:#ffbf96;--r3:#ff93ac;
  --glass:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05) 55%,rgba(255,255,255,.09));
  --edge:linear-gradient(160deg,rgba(255,255,255,.42),rgba(255,255,255,.07) 45%,rgba(255,255,255,.16));
  --serif:"New York","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--sky-top)}
body{color:var(--ink);font:15px/1.5 var(--sans);min-height:100vh;min-height:100dvh;
  background:radial-gradient(120% 60% at 50% 0%,rgba(143,214,255,.16),transparent 60%),linear-gradient(180deg,var(--sky-top),var(--sky-mid) 55%,var(--sky-bot));
  padding:calc(env(safe-area-inset-top) + 40px) 20px calc(env(safe-area-inset-bottom) + 40px)}
main{max-width:440px;margin:0 auto}
.hero{text-align:center;margin:20px 0 26px}
.hero .ico{width:116px;height:116px;margin:0 auto 18px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.hero .ico svg{width:100%;height:100%;display:block}
h1{font-family:var(--serif);font-weight:400;font-size:40px;letter-spacing:-.5px;line-height:1}
.hero p{color:var(--ink2);font-family:var(--serif);font-size:17px;margin-top:10px}
.card{background:var(--glass) padding-box,var(--edge) border-box;border:1px solid transparent;border-radius:24px;padding:16px;margin-top:12px;box-shadow:0 22px 44px -22px rgba(3,6,28,.7)}
.card h3{font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.row span:last-child{color:var(--ink2);text-align:right}
.ok{color:var(--good)!important}.no{color:var(--warn)!important}
.btn{width:100%;border:0;border-radius:16px;padding:14px;margin-top:12px;font:600 15px var(--sans);cursor:pointer;color:#2a1236;
  background:linear-gradient(115deg,var(--r1),var(--r2) 45%,var(--r3));box-shadow:0 12px 26px -12px rgba(255,170,160,.6)}
.btn.ghost{background:var(--glass) padding-box,var(--edge) border-box;border:1px solid transparent;color:var(--ink);box-shadow:none}
.note{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:13px;text-align:center;margin-top:18px}
#msg{min-height:22px;font-size:13px;color:var(--ink2);text-align:center;margin-top:10px}
</style>
</head>
<body>
<main>
  <div class="hero">
    <div class="ico" id="ico"></div>
    <h1>Kalendae</h1>
    <p>A forecast for your money.</p>
  </div>

  <div class="card">
    <h3>This phone</h3>
    <div id="checks"></div>
  </div>

  <button class="btn" id="test">Send a test notification</button>
  <button class="btn ghost" id="fix" style="display:none"></button>
  <div id="msg"></div>

  <p class="note">Version 0.1 · the foundation. Accounts, bills and the forecast arrive in the next steps.</p>
</main>
<script src="icons/icon.js"></script>
<script src="app.js"></script>
</body>
</html>
